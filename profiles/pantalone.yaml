name: pantalone
persona: "Регистратор"

# Название листа в Google-таблице — у этого профиля своё, не "Транзакции" (по умолчанию).
sheet_name: "Учёт"

# Профильная логика домохозяйства (см. UPGRADE_spec.md, часть 2):
# Для income/transfer сразу показываем подкатегории указанной категории (без выбора из
# полного списка) — у expense по-прежнему полный список категорий, без авто-подстановки.
auto_category:
  income: "Доходы"
  transfer: "Переводы"
optional_comment: true    # комментарий можно пропустить кнопкой (для expense/income/transfer)
sync_all_users: true      # в общую таблицу пишут все разрешённые пользователи, не только владелец

# Полный шер: у ВСЕХ участников профиля — один и тот же леджер (источники, категории,
# транзакции, /today, /week, /last, /edit_last, /delete_last — всё общее на двоих).
# Технически все сводятся к id владельца профиля (см. willem/config.py::ledger_user_id).
# Поле "Кто" по-прежнему определяется по реальному отправителю через people:.
shared_ledger: true

people:
  431744401: "Лика"
  1459561428: "Ярослав"
  540181178: "Админ"

# Типы источников, которые считаются долговыми (влияет на sources.kind при сидировании
# и при ручном добавлении через /sources — см. willem/config.py::_parse_seed_sources).
debt_types:
  - "Кредитная карта"
  - "Кредит"
  - "Кредитный лимит"
  - "Долг человеку"

# Подкатегория "Кредиты и долги" -> лист с графиком этого кредита в той же таблице
# (см. MTS_CREDIT_TEST.md). Названия подкатегорий совпадают с названиями листов —
# так задала сама Лика в листе "Справочники" (строки 74-76). При выборе одной из этих
# подкатегорий в expense-флоу включается доп. button-flow (тип платежа / что с
# переплатой), и после записи в "Учёт" бот дополнительно обновляет кредитный лист.
credit_sheets:
  "МТС Кредит Лики": "МТС Кредит Лики"
  "Tinkoff Кредит Лики": "Tinkoff Кредит Лики"
  "МТС Кредит Ярослава": "МТС Кредит Ярослава"
  "Tinkoff REF Кредит Лики": "Tinkoff REF Кредит Лики"

# Классификация долговых источников (kind="debt") для /balances — по подстроке в
# названии (без учёта регистра). Источники типа "Кредит" (Т-Кредит Лики и т.п.) не
# подходят ни под одно из этих слов — по решению Лики такие источники в /balances
# сейчас не показываются вовсе (график/остаток по ним ведётся в кредитных листах,
# см. credit_sheets выше).
debt_wallet_keywords: ["кредитка", "кубышка"]
debt_obligation_keywords: ["долг"]

currency_options:
  - ["KZT", "KZT"]
  - ["RUB", "RUB"]
  - ["USD", "USD"]
  - ["EUR", "EUR"]
  - ["CNY", "CNY"]

type_options:
  - ["Дебетовая карта", "Дебетовая карта"]
  - ["Наличные", "Наличные"]
  - ["Накопительный счёт", "Накопительный счёт"]
  - ["Депозит", "Депозит"]
  - ["Кредитная карта", "Кредитная карта"]
  - ["Кредит", "Кредит"]
  - ["Кредитный лимит", "Кредитный лимит"]
  - ["Долг человеку", "Долг человеку"]

